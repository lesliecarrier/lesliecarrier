name: Deploy Website

on:
  push:
    branches:
      - source

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Setup Hugo
        run: |
          sudo apt-get update
          sudo apt-get install -y hugo

      - name: Clone Theme
        run: |
          if [ ! -d "themes/hugo-freelancer-theme" ] || [ -z "$(ls -A themes/hugo-freelancer-theme)" ]; then
            git clone https://github.com/lesliecarrier/hugo-freelancer-theme.git themes/hugo-freelancer-theme
          fi

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1 # Update this to your actual region if different

      - name: Build and Deploy
        run: make build
